[project]
name = "spec-deliberator-gateway"
version = "0.1.0"
description = "Transient Webhook Proxy Service for Spec Deliberator Agent"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.2.2",
    "google-cloud-tasks>=2.16.0",
    "google-cloud-aiplatform>=1.60.0",
]
[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["*"]
