[project]
name = "agent-factory-workspace"
version = "0.1.0"
description = "Monorepo workspace for Spec Deliberator Agent Engine & Gateway Proxy"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "a2a-sdk[http-server]~=0.3.22",
    "aiohttp>=3.13.4",
    "google-adk[gcp]>=2.0.0,<3.0.0",
    "google-auth>=2.56.1",
    "python-dotenv>=1.2.2",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "httpx>=0.27.0",
    "google-cloud-logging>=3.10.0",
    "google-cloud-storage>=2.14.0",
    "pytest>=8.0.0",
    "requests>=2.31.0",
    "mcp<2.0.0",
]

[project.optional-dependencies]
eval = [
    "google-adk[eval]>=2.0.0,<3.0.0",
    "google-cloud-aiplatform[evaluation]>=1.156.0",
]
lint = [
    "ruff>=0.4.6,<1.0.0",
    "ty>=0.0.1a0",
    "codespell>=2.2.0,<3.0.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.0,<10.0.0",
    "pytest-asyncio>=1.0.0,<2.0.0",
    "nest-asyncio>=1.6.0,<2.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_default_fixture_loop_scope = "session"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
ignore = ["E501", "C901"]

[tool.uv.workspace]
members = ["spec_engine", "surface_gateway"]


